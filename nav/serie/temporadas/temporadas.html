<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporadas</title>
    <style>
        :root {
            --titulo: #0096e789;
            --ntemporada: #feb201ce;
            --menu: #ffed2728;
            --titulodesplegabl: #dc0000ad;
            --lista2: white;
        }

        body {
            background-image: url("../../../assets/cielo.png");
            background-size: cover;
            background-attachment: fixed;
            margin: 0;
            padding: 0;
        }

        .indice {
            position: relative;
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            padding: 0;
            text-align: center;
        }

        .banner {
            width: 100%;
            height: auto;
            display: block;
        }

        .logo {
            position: absolute;
            top: 5%;
            left: 23%;
            transform: translateX(-50%);
            width: 40%;
            height: auto;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
        }

        .menu {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);

            background-color: var(--menu);
            border-radius: 20px;
            padding: 15px;
            width: 95%;
            max-width: 1000px;
            color: #ffffff;
            box-shadow: rgba(0, 0, 0, 0.25) 0px 54px 55px, rgba(0, 0, 0, 0.12) 0px -12px 30px, rgba(0, 0, 0, 0.12) 0px 4px 6px, rgba(0, 0, 0, 0.17) 0px 12px 13px, rgba(0, 0, 0, 0.09) 0px -3px 5px;

        }

        .listamenu {
            display: flex;
            list-style: none;
            padding: 0;
            margin: 0;
            gap: 20px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .itemdelmenu {
            position: relative;
            margin-bottom: 0px;
        }

        .titulodesplegable {
            background-color: var(--titulodesplegabl);
            color: #ffffff;
            padding: 10px 10px;
            border-radius: 10px;
            text-decoration: none;
            box-shadow: rgba(0, 0, 0, 0.25) 0px 54px 55px, rgba(0, 0, 0, 0.12) 0px -12px 30px, rgba(0, 0, 0, 0.12) 0px 4px 6px, rgba(0, 0, 0, 0.17) 0px 12px 13px, rgba(0, 0, 0, 0.09) 0px -3px 5px;
        }

        .lista2 {
            list-style: none;
            padding-left: 15px;
            margin-top: 6px;
        }

        .lista2 li {
            margin: 4px 0;
        }

        .lista2 a {
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            display: block;
            padding: 4px 10px;
            border-radius: 4px;
        }

        .itemdelmenu details[open] .lista2 {
            position: absolute;
            background-color: var(--titulodesplegabl);
            padding: 8px;
            border-radius: 6px;
            min-width: 100px;
        }

        .contenedor {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        .titulo {
            background-color: var(--titulo);
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            font-size: 3rem;
            box-shadow: rgba(0, 0, 0, 0.25) 0px 54px 55px, rgba(0, 0, 0, 0.12) 0px -12px 30px, rgba(0, 0, 0, 0.12) 0px 4px 6px, rgba(0, 0, 0, 0.17) 0px 12px 13px, rgba(0, 0, 0, 0.09) 0px -3px 5px;
            margin-bottom: 50px;
        }


        .tarjetas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 30px;
            justify-content: center;
        }

        .tarjeta {
            position: relative;
            border-radius: 13px;
            overflow: hidden;
            box-shadow: rgba(0, 0, 0, 0.25) 0px 54px 55px, rgba(0, 0, 0, 0.12) 0px -12px 30px, rgba(0, 0, 0, 0.12) 0px 4px 6px, rgba(0, 0, 0, 0.17) 0px 12px 13px, rgba(0, 0, 0, 0.09) 0px -3px 5px;
            background-color: rgba(255, 255, 255, 0);
        }

        .tarjeta img {
            width: 100%;
            height: auto;
            display: block;
        }

        .numerotemporada {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background-color: var(--ntemporada);
            color: white;
            font-size: 1.5rem;
            padding: 3px 12px;
            border-radius: 19px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>

                    </details>
                </li>

                <li class="itemdelmenu">
                    <a href="./nav/lugares.html" class="titulodesplegable">Lugares</a>
                </li>

        </nav>

    <main class="contenedor">
