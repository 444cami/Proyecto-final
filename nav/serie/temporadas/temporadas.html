<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporadas</title>
    <style>
        :root {
            --titulo: #0096e789;
            --ntemporada: #feb201ce;
        }

        body {
            background-image: url("../../../assets/cielo.png");
            background-size: cover;
            background-attachment: fixed;
            margin: 0;
            padding: 0;
        }

        .indice {
            position: relative;
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            padding: 0;
            text-align: center;
        }

        .banner {
            width: 100%;
            height: auto;
            display: block;
        }

        .logo {
            position: absolute;
            top: 5%;
            left: 23%;
            transform: translateX(-50%);
            width: 40%;
            height: auto;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
        }

        .contenedor {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        .titulo {
            background-color: var(--titulo);
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            font-size: 3rem;
            box-shadow: rgba(0, 0, 0, 0.25) 0px 54px 55px, rgba(0, 0, 0, 0.12) 0px -12px 30px, rgba(0, 0, 0, 0.12) 0px 4px 6px, rgba(0, 0, 0, 0.17) 0px 12px 13px, rgba(0, 0, 0, 0.09) 0px -3px 5px;
            margin-bottom: 50px;
        }


        .tarjetas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 30px;
            justify-content: center;
        }

        .tarjeta {
            position: relative;
            border-radius: 13px;
            overflow: hidden;
            box-shadow: rgba(0, 0, 0, 0.25) 0px 54px 55px, rgba(0, 0, 0, 0.12) 0px -12px 30px, rgba(0, 0, 0, 0.12) 0px 4px 6px, rgba(0, 0, 0, 0.17) 0px 12px 13px, rgba(0, 0, 0, 0.09) 0px -3px 5px;
            background-color: rgba(255, 255, 255, 0);
        }

        .tarjeta img {
            width: 100%;
            height: auto;
            display: block;
        }

        .numerotemporada {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background-color: var(--ntemporada);
            color: white;
            font-size: 1.5rem;
            padding: 3px 12px;
            border-radius: 19px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>

<body>
    <header class="indice">
        <img src="../../../assets/header.png" alt="header" class="banner">
        <img src="../../../assets/logoprincipal.png" alt="Horadeaventura" class="logo">

    </header>

    <main class="contenedor">
        <h1 class="titulo">Temporadas</h1>

        <div class="tarjetas">
            <a href="./1.html" class="tarjeta">
                <span class="numerotemporada">1</span>
                <img src="../../../assets/t1.png" alt="Temporada 1">
            </a>

            <a href="./2.html" class="tarjeta">
                <span class="numerotemporada">2</span>
                <img src="../../../assets/t2.png" alt="Temporada 2">
            </a>

            <a href="./3.html" class="tarjeta">
                <span class="numerotemporada">3</span>
                <img src="../../../assets/t3.png" alt="Temporada 3">
            </a>

            <a href="./4.html" class="tarjeta">
                <span class="numerotemporada">4</span>
                <img src="../../../assets/t4.png" alt="Temporada 4">
            </a>

            <a href="./5.html" class="tarjeta">
                <span class="numerotemporada">5</span>
                <img src="../../../assets/t5.png" alt="Temporada 5">
            </a>

            <a href="./6.html" class="tarjeta">
                <span class="numerotemporada">6</span>
                <img src="../../../assets/t6.png" alt="Temporada 6">
            </a>

            <a href="./7.html" class="tarjeta">
                <span class="numerotemporada">7</span>
                <img src="../../../assets/t7.png" alt="Temporada 7">
            </a>

            <a href="./8.html" class="tarjeta">
                <span class="numerotemporada">8</span>
                <img src="../../../assets/t8.png" alt="Temporada 8">
            </a>

            <a href="./9.html" class="tarjeta">
                <span class="numerotemporada">9</span>
                <img src="../../../assets/t9.png" alt="Temporada 9">
            </a>

            <a href="./10.html" class="tarjeta">
                <span class="numerotemporada">10</span>
                <img src="../../../assets/t10.png" alt="Temporada 10">
            </a>
        </div>
    </main>

    <footer>

    </footer>

</body>

</html>
